<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>GNOMON Topografía — Compra</title>

  <style>
    :root {
      --bg: #f5f2e8;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --green: #218838;
      --green-dark: #176b2c;
      --border: #e5e7eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      max-width: 720px;
      margin: 60px auto;
      padding: 20px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 32px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .06);
    }

    .logo {
      width: 110px;
      max-width: 100%;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 1.7rem;
    }

    #estado {
      color: var(--muted);
      line-height: 1.6;
      margin: 0 auto 22px;
      max-width: 540px;
    }

    .spinner {
      width: 38px;
      height: 38px;
      margin: 24px auto;
      border: 4px solid #e5e7eb;
      border-top-color: var(--green);
      border-radius: 50%;
      animation: girar .8s linear infinite;
    }

    @keyframes girar {
      to {
        transform: rotate(360deg);
      }
    }

    .btn {
      display: inline-block;
      margin-top: 12px;
      padding: 12px 20px;
      border-radius: 10px;
      background: var(--green);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
    }

    .btn:hover {
      background: var(--green-dark);
    }
  </style>
</head>

<body>

  <main class="container">
    <section class="card">

      <img
        src="assets/img/logo_gnomon.png"
        alt="Logo GNOMON"
        class="logo"
      />

      <h1>Estamos verificando tu compra</h1>

      <div class="spinner"></div>

      <p id="estado">
        Estamos confirmando el pago de forma segura.
        No cierres esta página.
      </p>

      <a href="productos.html" class="btn">
        Volver a productos
      </a>

    </section>
  </main>

</body>
</html>
