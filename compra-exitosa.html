<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>GNOMON Topografía — Compra</title>

  <style>
    :root {
      --bg: #f5f2e8;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --green: #218838;
      --green-dark: #176b2c;
      --border: #e5e7eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      max-width: 720px;
      margin: 60px auto;
      padding: 20px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 32px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .06);
    }

    .logo {
      width: 110px;
      max-width: 100%;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 1.7rem;
    }

    #estado {
      color: var(--muted);
      line-height: 1.6;
      margin: 0 auto 22px;
      max-width: 540px;
    }

    .spinner {
      width: 38px;
      height: 38px;
      margin: 24px auto;
      border: 4px solid #e5e7eb;
      border-top-color: var(--green);
      border-radius: 50%;
      animation: girar .8s linear infinite;
    }

    @keyframes girar {
      to {
        transform: rotate(360deg);
      }
    }

    .btn {
      display: inline-block;
      margin-top: 12px;
      padding: 12px 20px;
      border-radius: 10px;
      background: var(--green);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
    }

    .btn:hover {
      background: var(--green-dark);
    }
  </style>
</head>

<body>

  <main class="container">
    <section class="card">

      <img
        src="assets/img/logo_gnomon.png"
        alt="Logo GNOMON"
        class="logo"
      />

      <h1>Estamos verificando tu compra</h1>

      <div class="spinner" id="spinner"></div>

      <p id="estado">
        Estamos confirmando el pago de forma segura.
        No cierres esta página.
      </p>

      <a href="productos.html" class="btn">
        Volver a productos
      </a>

    </section>
  </main>

 <script src="https://www.gstatic.com/firebasejs/12.4.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.4.0/firebase-auth-compat.js"></script> 
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDJnOSbkHZp5i87-TARh98GDlnRjEophqY",
    authDomain: "gnomon-store.firebaseapp.com",
    projectId: "gnomon-store",
    storageBucket: "gnomon-store.firebasestorage.app",
    messagingSenderId: "120541257174",
    appId: "1:120541257174:web:29c40bff654465f51d9877",
    measurementId: "G-27KWZ3JRLW"
  };

  firebase.initializeApp(firebaseConfig);

  const auth = firebase.auth();
  const proveedorGoogle = new firebase.auth.GoogleAuthProvider();

  const estado = document.getElementById("estado");
  const spinner = document.getElementById("spinner");
  const referencia = sessionStorage.getItem("gnomon_compra_reference");
  const producto = sessionStorage.getItem("gnomon_compra_producto");
  let descargaIniciada = false;
  async function iniciarDescarga() {
      if (descargaIniciada) return;
  descargaIniciada = true;
  try {
    if (!referencia) {
      estado.textContent =
        "No encontramos la referencia de esta compra. Vuelve a productos e inténtalo nuevamente.";
      return;
    }

    let usuario = auth.currentUser;

    if (!usuario) {
      estado.textContent =
        "Para entregar tu compra de forma segura, confirma tu cuenta de Google.";

      const resultadoLogin = await auth.signInWithPopup(proveedorGoogle);
      usuario = resultadoLogin.user;
    }

    estado.textContent =
      "Pago recibido. Estamos verificando tu compra antes de iniciar la descarga...";

    const token = await usuario.getIdToken(true);

    const respuesta = await fetch(
      "https://southamerica-east1-gnomon-store.cloudfunctions.net/descargarDynamo",
      {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${token}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          reference: referencia
        })
      }
    );

    if (!respuesta.ok) {
      throw new Error(`Estado de descarga: ${respuesta.status}`);
    }

    const archivo = await respuesta.blob();
    const urlArchivo = URL.createObjectURL(archivo);

    const enlace = document.createElement("a");
    enlace.href = urlArchivo;
    const nombreArchivo =
  producto === "lisp_predial"
    ? "pack_lisp_predial.zip"
    : "volumen_por_capas.pkt";

enlace.download = nombreArchivo;
    document.body.appendChild(enlace);
    enlace.click();
    enlace.remove();

    URL.revokeObjectURL(urlArchivo);

    estado.textContent =
      "¡Compra verificada! La descarga de tu archivo ha comenzado.";
    spinner.style.display = "none";

    sessionStorage.removeItem("gnomon_compra_reference");
    sessionStorage.removeItem("gnomon_compra_producto");
  } catch (error) {
    console.error("Error verificando la compra:", error);

    estado.textContent =
      "Tu pago puede estar procesándose todavía. No cierres esta página y vuelve a intentarlo en unos segundos.";
  }
}

auth.onAuthStateChanged(() => {
  iniciarDescarga();
});
</script>  
</body>
</html>
